[workspace]
resolver = "2"
members = ["crates/daholyvm-core", "crates/daholyvm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Paardhu22/win-vm"

[workspace.dependencies]
daholyvm-core = { path = "crates/daholyvm-core" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
